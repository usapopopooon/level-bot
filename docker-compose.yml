services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: level_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d level_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/level_bot
      TIMEZONE_OFFSET: ${TIMEZONE_OFFSET:-9}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CAFE_COLLECTION_PUBLIC_API_ENABLED: ${CAFE_COLLECTION_PUBLIC_API_ENABLED:-true}
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
      CHILL_API_KEY: ${CHILL_API_KEY:-${EXTERNAL_API_KEY:-}}
      MINECRAFT_API_KEY: ${MINECRAFT_API_KEY:-}
      ITSUKA_BOT_API_TOKEN: ${ITSUKA_BOT_API_TOKEN:-}
      USER_STATS_SITE_GUILD_ID: ${USER_STATS_SITE_GUILD_ID:-}
      USER_STATS_SITE_BASE_URL: ${USER_STATS_SITE_BASE_URL:-}
      INTRO_API_BASE_URL: ${INTRO_API_BASE_URL:-}
      INTRO_API_KEY: ${INTRO_API_KEY:-}
      MARIMO_BOT_API_TOKEN: ${MARIMO_BOT_API_TOKEN:-}
      CAFE_COLLECTION_API_TOKEN: ${CAFE_COLLECTION_API_TOKEN:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://app:8000
    depends_on:
      - app
    environment:
      API_URL: http://app:8000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
